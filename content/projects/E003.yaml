id: E003
title: Rapid assurance-vie simulator
slug: rapid-assurance-vie-simulator
status: live

summary_short: >
  A marketing campaign needed a savings simulator, but the normal development
  route was too slow. I took end-to-end responsibility for finding and
  implementing the viable technical route from UX concept to production
  within the campaign deadline, alongside contributions from other teams.
  The application
  remained useful and helped justify a more durable implementation;
  quantitative validation remains pending.
summary_standard: >
  The campaign deadline required an alternative route from UX exploration
  to production delivery. I took end-to-end responsibility for finding and
  implementing that technical route within the deadline. My implementation
  covered simulator architecture, calculation logic, data storage, PDF
  generation, contact and consent handling, marketing integration, and Piano
  Analytics tracking. Other teams also contributed to the wider project. The
  application launched in time and helped justify a more durable
  implementation. Completion of that long-term implementation and measured
  business impact remain pending.
summary_deep: >
  I found and implemented the viable technical route from UX concept to
  production within the campaign deadline. My implementation covered the
  simulator architecture, calculation logic, data storage, PDF generation,
  contact and consent handling, marketing integration, and Piano Analytics
  tracking. The wider project also involved contributions from other teams.
  The evidence map describes
  the project as live and validated, moving toward long-term implementation,
  and identifies analytics-backed validation as a demonstrated pattern.
  Validation methods and results, specific architecture technology choices,
  and details of other teams' contributions remain pending. This case
  supports prototyping as a path toward durable investment, an emerging
  pattern in the system model.

