id: E002
title: Analytics reporting for a non-analyst contributor
slug: analytics-reporting-non-analyst-contributor
status: implemented

summary_short: >
  A non-analyst contributor needed understandable reporting for a FAQ module
  of roughly 90 questions across three sites. I defined the reporting need
  with the data analyst and final user, then implemented the Piano Analytics
  API integration through Google Apps Script and the Google Sheets reporting
  layer with adjustable dates, consolidating reporting from all three sites.
  The workflow is implemented and evolving;
  measured user impact remains pending.
summary_standard: >
  The project connected Piano Analytics through its API to Google Apps Script
  and Google Sheets to make FAQ reporting understandable to a non-analyst
  contributor. I worked with the data analyst and final user to define the
  reporting need. I implemented the API integration through Google Apps Script,
  consolidated reporting from three sites, and implemented the Google Sheets
  reporting layer with adjustable dates in the user's preferred environment.
  Time savings,
  adoption, and measured changes in reporting usability remain pending.
summary_deep: >
  The documented data flow is Piano Analytics to API to Google Apps Script
  to Google Sheets. The FAQ module contained roughly 90 questions across
  three sites. I implemented the API integration through Google Apps Script
  and the Google Sheets reporting layer with adjustable dates, consolidating
  reporting from the three sites. The workflow included a simplified dashboard.
  The reporting need was defined with the data analyst and final user.
  Specific API queries, automation scheduling, data transformations, and
  dashboard measures remain pending.

